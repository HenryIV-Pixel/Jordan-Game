l_english:
 je_jor_hashemite_kingdom:0 "The Hashemite Kingdom"
 je_jor_hashemite_kingdom_reason:0 "A young king, a British subsidy, an army commanded by an Englishman and a population that is now two-thirds Palestinian. The kingdom must find its own feet before the decade is out."
 je_jor_baghdad_pact:0 "The Baghdad Pact"
 je_jor_baghdad_pact_reason:0 "London and Baghdad want Jordan inside the new Western alliance. Cairo radio calls it a betrayal of the Arabs. Whatever we decide, the street will have its say."
 je_jor_arab_legion:0 "Glubb Pasha's Army"
 je_jor_arab_legion_reason:0 "The Arab Legion is paid by Britain and led by Lieutenant-General Glubb. The Free Officers want it Arab in command as well as in name."
 je_jor_nabulsi:0 "The Nabulsi Government"
 je_jor_nabulsi_reason:0 "Elections have brought the nationalists and the left into government. They want the British gone and union with Egypt and Syria. The palace and the army are watching."

 jor_british_subsidy:0 "British Subsidy"
 jor_arab_subsidy:0 "Arab Solidarity Subsidy"
 jor_us_aid:0 "American Aid"
 jor_stall_money:0 "Bargaining with London"
 jor_martial_law:0 "Martial Law"
 jor_street_on_fire:0 "The Street in Revolt"
 jor_arab_legion_arabized:0 "An Arab Command"
 jor_officers_uneasy:0 "Uneasy Officers"
 jor_phosphate_drive:0 "Phosphate Drive"
 jor_aqaba_port:0 "Port of Aqaba"
 jor_ig_pleased:0 "Pleased by Recent Events"
 jor_ig_angered:0 "Angered by Recent Events"
 jor_ig_crushed:0 "Suppressed"

 jor_decision_phosphate_drive:0 "Develop the Phosphate Mines"
 jor_decision_phosphate_drive_desc:0 "The Ruseifa deposits are Jordan's one great mineral. Invest in the mines and the railway to the coast."
 jor_decision_aqaba_port:0 "Build Up Aqaba"
 jor_decision_aqaba_port_desc:0 "Our only port on the sea. Deepen the harbour so that trade need not pass through Beirut or Haifa."

 jor.1.t:0 "General Templer in Amman"
 jor.1.d:0 "The Chief of the Imperial General Staff has arrived with an offer: join the Baghdad Pact, and Britain will pay for a larger Arab Legion and revise the old treaty. Iraq's Hashemite cousins urge us in. Cairo radio is already calling it treason."
 jor.1.f:0 "\"Templer came to sell us a pact. The street came to tell us its price.\""
 jor.1.a:0 "Put the pact before the cabinet."
 jor.1.b:0 "Refuse. Not while Cairo speaks for every Arab street."
 jor.1.c:0 "Stall, and ask London for more."
 jor.2.t:0 "Riots from Amman to Jerusalem"
 jor.2.d:0 "Word that the government will sign has brought crowds into every town on both banks. Western consulates burn in Jerusalem. Ministers from the West Bank resign, and the Legion is asking for orders."
 jor.2.f:0 "\"The cabinet lasted five days.\""
 jor.2.a:0 "Martial law. The pact will be signed."
 jor.2.b:0 "Let the government fall and dissolve the House."
 jor.3.t:0 "Glubb Pasha"
 jor.3.d:0 "For twenty-five years John Bagot Glubb has commanded the Arab Legion. The young officers resent British command, Cairo mocks a king whose army answers to London, and the King has heard enough."
 jor.3.f:0 "\"He was given until the next morning to leave.\""
 jor.3.a:0 "Dismiss him and Arabize the command."
 jor.3.b:0 "Keep him. The army and the money need him."
 jor.4.t:0 "The 1956 Election"
 jor.4.d:0 "The freest election Jordan has held has made the National Socialist Party the largest bloc, with Baathists and communists beside it. Suleiman al-Nabulsi expects to be asked to form a government."
 jor.4.f:0 "\"For the first time the House looked like the street.\""
 jor.4.a:0 "Ask Nabulsi to form a government."
 jor.4.b:0 "Appoint a loyal man from the palace instead."
 jor.5.t:0 "The Arab Solidarity Agreement"
 jor.5.d:0 "Egypt, Syria and Saudi Arabia have offered to pay what Britain pays, if Jordan ends the Anglo-Jordanian Treaty. The money is promised, not yet in the bank."
 jor.5.f:0 "\"Britain's last soldiers left in July 1957.\""
 jor.5.a:0 "End the treaty. Arab money for an Arab army."
 jor.5.b:0 "Keep the treaty and the money we can count."
 jor.6.t:0 "The April Crisis"
 jor.6.d:0 "The government has retired loyal officials, talks openly of union with Egypt and Syria and is opening ties with Moscow. Officers at Zarqa are restless and nobody knows whose side they are on. The palace must act or give way."
 jor.6.f:0 "\"Within a month the parties were banned and the curfew was back.\""
 jor.6.a:0 "Dismiss the government. Ban the parties. Martial law."
 jor.6.b:0 "Let the elected government stand."
 jor.9.t:0 "The Kingdom Endures"
 jor.9.d_palace:0 "The crown has outlasted the Pact riots, Glubb's departure and the nationalist government. The parties are banned and American money has replaced British. The throne is safe, and the House is quiet."
 jor.9.d_other:0 "The decade's storms have passed and the kingdom has taken a different road from history: power shared with an elected government and an uncertain peace between palace and street."
 jor.9.a:0 "So it goes."
